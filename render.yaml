# Render Blueprint — déploie le backend (Web Service) et le frontend (Static Site).
# Doc : https://render.com/docs/blueprint-spec
#
# Après le 1er déploiement, renseigner les URLs croisées :
#   - CORS_ORIGIN (backend)  = URL publique du frontend
#   - VITE_API_URL (frontend) = URL publique du backend
# puis relancer le build du frontend (VITE_API_URL est injecté au build).

services:
  # ---------- API NestJS ----------
  - type: web
    name: edpulse-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/products?limit=1
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: CORS_ORIGIN
        sync: false # à définir : URL du frontend (ex : https://edpulse-web.onrender.com)

  # ---------- Frontend React (build statique) ----------
  - type: web
    name: edpulse-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false # à définir : URL du backend (ex : https://edpulse-api.onrender.com)
    routes:
      # SPA fallback : toutes les routes servent index.html
      - type: rewrite
        source: /*
        destination: /index.html
